<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 28 — English 6 Global Success</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#182230;--muted:#64748b;--accent:#4f46e5;--accent2:#06b6d4;--line:#e2e8f0;--good:#15803d;--bad:#b91c1c;--soft:#eef2ff}
body.dark{--bg:#0b1120;--panel:#121c2e;--text:#e5edf8;--muted:#a8b6ca;--accent:#818cf8;--accent2:#22d3ee;--line:#29364b;--good:#4ade80;--bad:#f87171;--soft:#202947}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;transition:.2s}
header{background:linear-gradient(120deg,#312e81,#4f46e5,#0891b2);color:white;padding:28px 18px 22px}.header-inner{max-width:1100px;margin:auto}.eyebrow{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}h1{margin:6px 0;font-size:clamp(1.7rem,4vw,2.5rem);line-height:1.2}header p{margin:8px 0 0;opacity:.92}
.toolbar{max-width:1100px;margin:auto;padding:14px 18px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.progress-wrap{flex:1;min-width:180px}.progress-label{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between}.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:9px 14px;background:var(--panel);color:var(--text);font-weight:650}button:hover{filter:brightness(.97);transform:translateY(-1px)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed;transform:none}
main{max-width:1100px;margin:auto;padding:0 18px 30px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}nav,.content-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px #00000008}nav{padding:14px;height:max-content;position:sticky;top:12px}.nav-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px}.nav-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}.nav-item.active{background:var(--soft);color:var(--accent)}
.content-card{padding:clamp(18px,3vw,32px);min-height:480px}.section{display:none}.section.active{display:block}h2{font-size:1.65rem;line-height:1.25;margin:0 0 10px}h3{margin:24px 0 8px;font-size:1.15rem}.lead{color:var(--muted);margin-top:0}.callout{border-left:4px solid var(--accent);background:var(--soft);padding:14px 16px;border-radius:0 12px 12px 0;margin:16px 0}.formula{font-weight:750;font-size:1.05rem}
.word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.word{border:1px solid var(--line);border-radius:12px;padding:12px}.word strong{display:block}.translation{color:var(--muted);font-size:.92rem}
.question{padding:16px;border:1px solid var(--line);border-radius:14px;margin:14px 0}.question p{font-weight:700;margin:0 0 8px}.options{display:grid;gap:8px;margin-top:8px}.option{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.option:has(input:checked){border-color:var(--accent);background:var(--soft)}input[type=radio]{margin-top:6px;accent-color:var(--accent)}
input[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}.feedback{font-weight:650;margin-top:8px}.correct{color:var(--good)}.incorrect{color:var(--bad)}.score-box{background:var(--soft);border-radius:14px;padding:18px;margin:16px 0}.answer-key{border:1px dashed var(--line);padding:14px;border-radius:12px;margin:12px 0}.hidden{display:none!important}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}footer{text-align:center;color:var(--muted);padding:16px;font-size:.88rem}
@media(max-width:760px){main{grid-template-columns:1fr}nav{position:static;display:grid;grid-template-columns:1fr 1fr;gap:4px}.nav-title{grid-column:1/-1}.content-card{min-height:0}.toolbar{padding:12px}.question{padding:12px}}
@media print{header,.toolbar,nav,.actions{display:none!important}main{display:block;max-width:none;padding:0}.content-card{border:0;box-shadow:none}.section{display:block!important;page-break-inside:avoid}body{background:white;color:black}}
</style></head><body>
<header><div class="header-inner"><div class="eyebrow">TIẾNG ANH 6 · GLOBAL SUCCESS</div><h1>Lesson 28</h1><p>Interactive lesson • Học từ vựng, ngữ pháp và luyện tập</p></div></header>
<div class="toolbar"><div class="progress-wrap"><div class="progress-label"><span id="progressText">Page 1</span><span id="progressPercent">25%</span></div><div class="progress"><span id="progressBar"></span></div></div><button id="themeBtn">🌙 Dark mode</button></div>
<main><nav><div class="nav-title">Nội dung bài học</div><button class="nav-item active" data-page="0">📘 Lesson overview</button><button class="nav-item" data-page="1">🧠 Grammar</button><button class="nav-item" data-page="2">✍️ Practice</button><button class="nav-item" data-page="3">💡 Answer key</button></nav><div class="content-card" id="content"></div></main>
<footer>Lesson 28 · English 6 Global Success · Mở file bằng trình duyệt trên điện thoại hoặc máy tính.</footer>
<script>
const lessons={
26:{title:"My Neighbourhood – Unit 4",intro:"Khu phố của tôi",vocab:[
["neighbourhood","khu phố","nây-bờ-hút"],["street","đường phố","strít"],["town","thị trấn","tao-n"],["city","thành phố","xi-ti"],["busy","nhộn nhịp, bận rộn","bi-zi"],["quiet","yên tĩnh","quai-ợt"],["noisy","ồn ào","noi-zi"],["modern","hiện đại","mo-đần"],["beautiful","đẹp","biu-ti-phồ"],["expensive","đắt tiền","ịch-spen-siv"],["crowded","đông đúc","krao-địt"],["convenient","thuận tiện","cần-vi-ni-ần-t"]],
grammar:`<h3>So sánh hơn với tính từ ngắn</h3><div class="example"><b>S + am/is/are + adjective-er + than + ...</b><br>My house is smaller than your house. — Nhà tôi nhỏ hơn nhà bạn.</div><h3>So sánh hơn với tính từ dài</h3><div class="example"><b>S + am/is/are + more + adjective + than + ...</b><br>This city is more beautiful than that city. — Thành phố này đẹp hơn thành phố kia.</div><h3>Một số dạng đặc biệt</h3><p>good → better; bad → worse; big → bigger; hot → hotter; happy → happier; noisy → noisier; large → larger; small → smaller; long → longer; short → shorter.</p>`,
quiz:[["My house is ____ than your house.",["small","smaller","more small"],1],["This city is ____ beautiful than my town.",["more","most","-er"],0],["A city is often ____ than a village.",["noisier","more noisyer","noisy"],0],["Today is ____ than yesterday.",["hotter","hoter","more hot"],0],["My English is ____ than before.",["gooder","better","more good"],1]],
written:[["Nhà tôi lớn hơn nhà bạn.","My house is bigger than your house."],["Con đường này đông đúc hơn.","This street is more crowded."],["Thành phố này đẹp hơn thị trấn kia.","This city is more beautiful than that town."],["Ngôi nhà này đắt hơn ngôi nhà đó.","This house is more expensive than that house."],["Khu phố của tôi yên tĩnh hơn.","My neighbourhood is quieter than yours."]]},
27:{title:"My Neighbourhood – Part 1",intro:"Từ vựng địa điểm và so sánh hơn",vocab:[
["neighbourhood","khu phố","nây-bờ-hút"],["place","địa điểm","plâys"],["street","đường phố","striit"],["building","tòa nhà","bil-đing"],["market","chợ","ma-kịt"],["supermarket","siêu thị","su-pờ-ma-kịt"],["hospital","bệnh viện","hót-pi-tồl"],["restaurant","nhà hàng","rés-tờ-ront"],["post office","bưu điện","pâu-st ó-fis"],["railway station","ga đường sắt","rây-uây stây-shần"],["crowded","đông đúc","crau-đid"],["quiet","yên tĩnh","quai-ợt"],["noisy","ồn ào","noi-zi"],["modern","hiện đại","mó-đần"],["convenient","thuận tiện","cờn-vi-ni-ờnt"],["peaceful","yên bình","piiss-phồl"],["narrow","hẹp","ne-râu"],["wide","rộng","quai-đ"],["expensive","đắt đỏ","ik-spen-siv"],["cheap","rẻ","chiip"]],
grammar:`<h3>So sánh hơn</h3><div class="example"><b>Tính từ ngắn:</b> S + am/is/are + adjective-er + than + N/pronoun.<br>Lan is taller than Hoa. — Lan cao hơn Hoa.</div><div class="example"><b>Tính từ dài:</b> S + am/is/are + more + adjective + than + N/pronoun.<br>This house is more expensive than that house.</div><h3>Cách thêm -er</h3><p>Thông thường: tall → taller. Gấp đôi phụ âm cuối: big → bigger. Kết thúc bằng y: noisy → noisier.</p><h3>Bất quy tắc</h3><p>good → better; bad → worse; far → farther/further.</p><h3>Tránh lỗi</h3><p>❌ more bigger → ✅ bigger • ❌ taller that → ✅ taller than • ❌ She are → ✅ She is</p>`,
quiz:[["My school is ____ than your school.",["big","bigger","more big"],1],["This street is ____ than that street.",["noisier","more noisy","noisy"],0],["A hospital is ____ than a small shop.",["more large","larger","large"],1],["This restaurant is ____ than that restaurant.",["expensive","expensiver","more expensive"],2],["My neighbourhood is ____ than before.",["peaceful","more peaceful","peacefuler"],1]],
written:[["Nhà tôi to hơn nhà bạn.","My house is bigger than your house."],["Lan cao hơn Hoa.","Lan is taller than Hoa."],["Con phố này đông đúc hơn con phố kia.","This street is more crowded than that street."],["Khu phố của tôi yên tĩnh hơn.","My neighbourhood is quieter."],["Nhà hàng này đắt hơn nhà hàng kia.","This restaurant is more expensive than that restaurant."]]},
28:{title:"Natural Wonders of Viet Nam – Unit 5",intro:"Kỳ quan thiên nhiên Việt Nam",vocab:[
["mountain","ngọn núi","mao-tần"],["river","dòng sông","ri-vờ"],["lake","hồ","lâyk"],["island","hòn đảo","ai-lần"],["beach","bãi biển","bi-ch"],["forest","rừng","fo-rịt"],["cave","hang động","câyv"],["waterfall","thác nước","wo-tờ-fo:l"],["beautiful","đẹp","biu-ti-phồ"],["famous","nổi tiếng","phây-mợs"],["visit","thăm","vi-zịt"],["take photos","chụp ảnh","tâyk phâu-tâu"]],
grammar:`<h3>MUST – Phải</h3><div class="example"><b>S + must + động từ nguyên mẫu.</b><br>You must follow the rules. — Bạn phải tuân theo các quy định.</div><h3>MUSTN'T – Không được</h3><div class="example"><b>S + mustn't + động từ nguyên mẫu.</b><br>You mustn't litter. — Bạn không được xả rác.</div><p>💡 Sau <b>must</b> và <b>mustn't</b>, động từ luôn giữ nguyên mẫu.</p>`,
quiz:[["You must ____ the environment.",["protect","protects","protecting"],0],["You mustn't ____ rubbish.",["throws","throw","throwing"],1],["Ha Long Bay is very ____.",["beautiful","beautifully","beauty"],0],["We can ____ photos at the beach.",["take","takes","taking"],0],["A place with many trees is a ____.",["river","forest","island"],1]],
written:[["Bạn phải giữ bãi biển sạch sẽ.","You must keep the beach clean."],["Bạn không được xả rác.","You mustn't litter."],["Tôi thích những ngọn núi đẹp.","I like beautiful mountains."],["Chúng ta phải bảo vệ động vật hoang dã.","We must protect wild animals."],["Tôi muốn thăm một hang động.","I want to visit a cave."]]}
};
const d=lessons[28];
const content=document.getElementById('content');
const vocab=d.vocab.map(v=>`<div class="word"><strong>${v[0]}</strong>${v[1]}<div class="translation">🔊 ${v[2]}</div></div>`).join('');
const quiz=d.quiz.map((q,i)=>`<div class="question"><p>${i+1}. ${q[0]}</p><div class="options">${q[1].map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${a}</label>`).join('')}</div><div class="feedback hidden" id="feedback${i}"></div></div>`).join('');
const writing=d.written.map((w,i)=>`<div class="question"><p>${i+1}. ${w[0]}</p><input type="text" placeholder="Nhập câu trả lời của cậu"><div class="feedback hidden" id="write${i}">Đáp án mẫu: ${w[1]}</div></div>`).join('');
const answerList=d.quiz.map((q,i)=>`<li>${q[0]} <b>${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}</b></li>`).join('');
const writingList=d.written.map(w=>`<li>${w[0]}<br><b>${w[1]}</b></li>`).join('');
content.innerHTML=`
<section class="section active"><h2>📚 Vocabulary — Từ vựng</h2><p class="lead">${d.intro}</p><div class="word-grid">${vocab}</div><div class="callout">✨ Mẹo: Đọc từ tiếng Anh, che nghĩa tiếng Việt rồi tự kiểm tra nhé!</div></section>
<section class="section"><h2>🧠 Grammar — Ngữ pháp</h2>${d.grammar}<div class="callout">📌 Đọc ví dụ thành tiếng và chú ý cấu trúc câu.</div></section>
<section class="section"><h2>✍️ Practice — Bài tập</h2><p class="lead">Chọn đáp án đúng, sau đó bấm Chấm điểm. Phần dịch có đáp án mẫu.</p>${quiz}<div class="actions"><button class="primary" id="gradeBtn">✅ Chấm điểm</button><button id="showWriting">💡 Hiện đáp án dịch</button></div><div class="score-box hidden" id="scoreBox"></div><h3>Translate into English</h3>${writing}</section>
<section class="section"><h2>💡 Answer key — Đáp án</h2><h3>Trắc nghiệm</h3><ol>${answerList}</ol><h3>Dịch câu — đáp án gợi ý</h3><ol>${writingList}</ol><div class="callout">🌟 Hãy thử làm lại bài mà không nhìn đáp án để ghi nhớ lâu hơn.</div></section>`;
const sections=[...document.querySelectorAll('.section')],navItems=[...document.querySelectorAll('.nav-item')];let current=0;
function showPage(i){current=Math.max(0,Math.min(sections.length-1,i));sections.forEach((s,j)=>s.classList.toggle('active',j===current));navItems.forEach((b,j)=>b.classList.toggle('active',j===current));let pct=Math.round((current+1)/sections.length*100);document.getElementById('progressText').textContent=`Page ${current+1} of ${sections.length}`;document.getElementById('progressPercent').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';window.scrollTo({top:0,behavior:'smooth'});}
navItems.forEach(b=>b.onclick=()=>showPage(+b.dataset.page));
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️ Light mode':'🌙 Dark mode'};
document.getElementById('gradeBtn').onclick=()=>{let score=0;d.quiz.forEach((q,i)=>{let a=document.querySelector(`input[name="q${i}"]:checked`),f=document.getElementById('feedback'+i);f.classList.remove('hidden');if(a&&+a.value===q[2]){score++;f.className='feedback correct';f.textContent='✓ Chính xác!'}else{f.className='feedback incorrect';f.textContent='Đáp án: '+String.fromCharCode(65+q[2])+'. '+q[1][q[2]]}});let b=document.getElementById('scoreBox');b.classList.remove('hidden');b.innerHTML=`🎯 Cậu đạt <b>${score}/${d.quiz.length}</b> điểm (${score*100/d.quiz.length}%). ${score===d.quiz.length?'Xuất sắc! 🌟':'Ôn lại đáp án rồi thử thêm lần nữa nhé!'}`};
document.getElementById('showWriting').onclick=()=>d.written.forEach((_,i)=>document.getElementById('write'+i).classList.toggle('hidden'));
showPage(0);
</script></body></html>
